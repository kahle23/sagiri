
spring:
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/sagiri_test?autoReconnect=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false&serverTimezone=CTT&nullCatalogMeansCurrent=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456



logging:
  home: /tmp/logs/
  level:
    root: info
    org.springframework.jdbc.core.JdbcTemplate: debug


kunlun:
  exception:
    enabled: true
  cache:
    enabled: true
    simple:
      - name: "simple-5m"
        reference-type: soft
        time-to-live: 5
        time-to-live-unit: minutes
      - name: "simple-30m"
        reference-type: soft
        time-to-live: 30
        time-to-live-unit: minutes
      - name: "simple-2h"
        reference-type: soft
        time-to-live: 2
        time-to-live-unit: hours
    redis:
      - name: "redis-30m"
        lock-manager: "redis"
        time-to-live: 30
        time-to-live-unit: minutes
      - name: "redis-2h"
        lock-manager: "redis"
        time-to-live: 2
        time-to-live-unit: hours
      - name: "redis-4h"
        lock-manager: "redis"
        time-to-live: 4
        time-to-live-unit: hours
    jdbc:
      - name: "jdbc-2d"
        lock-manager: "redis"
        time-to-live: 2
        time-to-live-unit: days
      - name: "jdbc-10d"
        lockManager: "redis"
        time-to-live: 10
        time-to-live-unit: days
      - name: "jdbc-30d"
        lockManager: "redis"
        time-to-live: 30
        time-to-live-unit: days





