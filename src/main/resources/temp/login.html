<!doctype html>
<html  class="x-admin-sm">
<head>
	<meta charset="UTF-8">
	<title>管理登录</title>
	<meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="stylesheet" href="/css/font.css">
    <link rel="stylesheet" href="/css/login.css">
	  <link rel="stylesheet" href="/css/index.css">
    <script type="text/javascript" src="https://cdn.bootcss.com/jquery/3.2.1/jquery.min.js"></script>
    <script src="/lib/layui/layui.js" charset="utf-8"></script>

</head>
<body class="login-bg">
    
    <div class="login layui-anim layui-anim-up">
        <div class="message">管理登录</div>
        <div id="darkbannerwrap"></div>
        
        <form class="layui-form" >
            <input name="username" placeholder="用户名"  type="text" lay-verify="required" class="layui-input" >
            <hr class="hr15">
            <input name="password" lay-verify="required" placeholder="密码"  type="password" class="layui-input">
            <hr class="hr15">
            <input value="登录" lay-submit lay-filter="login" style="width:100%;" type="submit">
            <hr class="hr20" >
        </form>
    </div>

    <script>
        layui.use(['layer', 'form'], function() {
            var $ = layui.jquery;
            var layer = layui.layer;
            var form = layui.form;
            //监听提交
            form.on('submit(login)', function(data) {
                // 调用登录接口
                $.ajax({
                    url:"/api/admin/login", // 目标URL
                    type:"post", // 请求类型，可以是GET、POST等
                    contentType: 'application/json', // 发送信息至服务器时内容编码类型
                    data: JSON.stringify(data.field), // 将对象转换为JSON字符串作为发送数据
                    dataType:"json", // 预期服务器返回的数据类型
                    success: function(data) {
                        // 请求成功时的回调函数
                        if (data.success) {
                            layer.msg("登录成功！", {icon:6, time:2000}, function() {
                                // 先将页签记忆清空，以免上次登陆的用户的菜单对于此次登录的用户无权限而跳转到403页面
                                // index.clearTabCache();
                                location.href = '/admin/index'
                            });
                        } else {
                            layer.msg(data.message, {icon:5, time:2000});
                        }
                    },
                    error: function(xhr, status, error) {
                        // 请求失败时的回调函数
                        layer.msg("网络错误！", {icon:5, time:2000});
                        console.log(xhr.responseText);
                    }
                });
                // 阻止表单跳转
                return false;
            });
        });
    </script>
    <!-- 底部结束 -->

</body>
</html>
